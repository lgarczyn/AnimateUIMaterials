name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semver version (e.g. 1.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      # ----- main branch: bump, commit, tag -----

      - name: Bump package.json version
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          PKG="Unity/Animate UI Material/Assets/Plugins/Animate UI Materials/package.json"
          jq --arg v "$NEW_VERSION" '.version = $v' "$PKG" > "$PKG.tmp" && mv "$PKG.tmp" "$PKG"

      - name: Commit, tag, and push main
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG="Unity/Animate UI Material/Assets/Plugins/Animate UI Materials/package.json"

          # Commit only if the bump produced a real diff. Re-running the workflow against an
          # already-released version is a no-op here — keep going so the upm side can finish.
          if ! git diff --quiet -- "$PKG"; then
            git add "$PKG"
            git commit -m "Release $NEW_VERSION"
            git push origin HEAD
          else
            echo "package.json already at $NEW_VERSION; nothing to commit"
          fi

          # Tag main only if the tag doesn't already exist.
          if ! git rev-parse -q --verify "refs/tags/$NEW_VERSION" >/dev/null; then
            git tag "$NEW_VERSION"
            git push origin "refs/tags/$NEW_VERSION"
          else
            echo "Tag $NEW_VERSION already exists on main; skipping"
          fi

      # ----- upm branch: rebuild from main, force-push, tag upm/<version> -----
      #
      # Combined into the same workflow because GitHub Actions does not trigger downstream
      # workflows from GITHUB_TOKEN pushes — splitting these into two workflows means the
      # second one never fires automatically. Keeping it inline avoids needing a PAT.

      - name: Rebuild upm branch
        run: |
          set -euo pipefail
          PKG="Unity/Animate UI Material/Assets/Plugins/Animate UI Materials"

          if [ ! -d "$PKG" ]; then
            echo "::error::Package folder not found at $PKG"
            exit 1
          fi

          # Capture repo-root documentation files (Package Manager UI shows these)
          DOCS=$(mktemp -d)
          [ -f "Readme.md"    ] && cp "Readme.md"    "$DOCS/README.md"
          [ -f "Changelog.md" ] && cp "Changelog.md" "$DOCS/CHANGELOG.md"
          [ -f "LICENSE"      ] && cp "LICENSE"      "$DOCS/LICENSE.md"

          # Snapshot the package contents
          STAGE=$(mktemp -d)
          cp -a "$PKG/." "$STAGE/"

          # Switch to a throwaway local branch so we don't mutate main locally
          git checkout -B upm-build

          # Wipe everything in the work tree except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Restore package contents at the repo root
          cp -a "$STAGE/." .

          # Drop in README/CHANGELOG/LICENSE at root for Package Manager UI tabs
          cp -a "$DOCS/." .

          rm -rf "$STAGE" "$DOCS"

          # UPM folder-name conventions
          if [ -d "Examples" ]; then
            mkdir -p "Samples~"
            mv "Examples" "Samples~/Examples"
            rm -f "Examples.meta"
          fi
          if [ -d "Docs" ]; then
            mv "Docs" "Documentation~"
            rm -f "Docs.meta"
          fi

          # Commit and force-push to upm
          git add -A
          git commit -m "Sync upm @ ${GITHUB_SHA:0:7}"
          git push -f origin HEAD:refs/heads/upm

      - name: Tag upm tip with upm/<version>
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          UPM_TAG="upm/${NEW_VERSION}"

          # Refuse to overwrite an existing upm/* tag — old releases must stay reachable
          # via their original tag, even after the upm branch tip moves past them.
          git fetch origin "refs/tags/${UPM_TAG}:refs/tags/${UPM_TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${UPM_TAG}" >/dev/null; then
            echo "::error::${UPM_TAG} already exists — refusing to overwrite. Old releases must stay reachable."
            exit 1
          fi

          git tag "${UPM_TAG}"
          git push origin "refs/tags/${UPM_TAG}"

      # ----- GitHub Release with auto-generated notes -----

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
