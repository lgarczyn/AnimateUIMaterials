name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New semver version (e.g. 1.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Bump package.json version
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          PKG="Unity/Animate UI Material/Assets/Plugins/Animate UI Materials/package.json"
          jq --arg v "$NEW_VERSION" '.version = $v' "$PKG" > "$PKG.tmp" && mv "$PKG.tmp" "$PKG"

      - name: Commit, tag, and push main
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG="Unity/Animate UI Material/Assets/Plugins/Animate UI Materials/package.json"

          # Allow re-runs to reach the upm steps
          if ! git diff --quiet -- "$PKG"; then
            git add "$PKG"
            git commit -m "Release $NEW_VERSION"
            git push origin HEAD
          else
            echo "package.json already at $NEW_VERSION; nothing to commit"
          fi

          if ! git rev-parse -q --verify "refs/tags/$NEW_VERSION" >/dev/null; then
            git tag "$NEW_VERSION"
            git push origin "refs/tags/$NEW_VERSION"
          else
            echo "Tag $NEW_VERSION already exists on main; skipping"
          fi

      # Keep upm steps in this workflow, since GITHUB_TOKEN pushes trigger no workflows

      - name: Rebuild upm branch
        run: |
          set -euo pipefail
          PKG="Unity/Animate UI Material/Assets/Plugins/Animate UI Materials"

          if [ ! -d "$PKG" ]; then
            echo "::error::Package folder not found at $PKG"
            exit 1
          fi

          STAGE=$(mktemp -d)
          cp -a "$PKG/." "$STAGE/"

          # Use a local branch to keep main untouched
          git checkout -B upm-build

          # Wipe everything in the work tree except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Don't copy README/CHANGELOG/LICENSE, to avoid missing .meta warnings
          cp -a "$STAGE/." .

          rm -rf "$STAGE"

          # Rename folders to UPM conventions
          if [ -d "Examples" ]; then
            mkdir -p "Samples~"
            mv "Examples" "Samples~/Examples"
            rm -f "Examples.meta"
          fi
          if [ -d "Docs" ]; then
            mv "Docs" "Documentation~"
            rm -f "Docs.meta"
          fi

          git add -A
          git commit -m "Sync upm @ ${GITHUB_SHA:0:7}"
          git push -f origin HEAD:refs/heads/upm

      - name: Tag upm tip with upm/<version>
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          UPM_TAG="upm/${NEW_VERSION}"

          # Fail if upm tag exists to keep old releases reachable
          git fetch origin "refs/tags/${UPM_TAG}:refs/tags/${UPM_TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${UPM_TAG}" >/dev/null; then
            echo "::error::${UPM_TAG} already exists, not overwriting"
            exit 1
          fi

          git tag "${UPM_TAG}"
          git push origin "refs/tags/${UPM_TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          generate_release_notes: true
