name: Sync UPM branch

on:
  workflow_dispatch:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: sync-upm
  cancel-in-progress: false

jobs:
  sync-upm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Rebuild upm branch
        run: |
          set -euo pipefail
          PKG="Unity/Animate UI Material/Assets/Plugins/Animate UI Materials"

          if [ ! -d "$PKG" ]; then
            echo "::error::Package folder not found at $PKG"
            exit 1
          fi

          # 1. Capture repo-root documentation files (Package Manager UI shows these)
          DOCS=$(mktemp -d)
          [ -f "Readme.md"    ] && cp "Readme.md"    "$DOCS/README.md"
          [ -f "Changelog.md" ] && cp "Changelog.md" "$DOCS/CHANGELOG.md"
          [ -f "LICENSE"      ] && cp "LICENSE"      "$DOCS/LICENSE.md"

          # 2. Snapshot the package contents
          STAGE=$(mktemp -d)
          cp -a "$PKG/." "$STAGE/"

          # 3. Switch to a throwaway local branch (don't mutate main locally)
          git checkout -B upm-build

          # 4. Wipe the work tree except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # 5. Restore package contents at repo root
          cp -a "$STAGE/." .

          # 6. Drop in README/CHANGELOG/LICENSE at root for Package Manager UI tabs
          cp -a "$DOCS/." .

          # 7. Cleanup temp dirs
          rm -rf "$STAGE" "$DOCS"

          # 8. UPM folder-name conventions
          if [ -d "Examples" ]; then
            mkdir -p "Samples~"
            mv "Examples" "Samples~/Examples"
            rm -f "Examples.meta"
          fi
          if [ -d "Docs" ]; then
            mv "Docs" "Documentation~"
            rm -f "Docs.meta"
          fi

          # 9. Commit and force-push to upm
          git add -A
          git commit -m "Sync upm @ ${GITHUB_SHA:0:7}"
          git push -f origin HEAD:refs/heads/upm

      - name: Tag upm tip with upm/<version>
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          UPM_TAG="upm/${TAG}"

          # Refuse to overwrite an existing upm/* tag — older releases must remain
          # reachable via their original tag, even after the upm branch tip moves.
          git fetch origin "refs/tags/${UPM_TAG}:refs/tags/${UPM_TAG}" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/${UPM_TAG}" >/dev/null; then
            echo "::error::${UPM_TAG} already exists — refusing to overwrite. Old releases must stay reachable."
            exit 1
          fi

          git tag "${UPM_TAG}"
          git push origin "refs/tags/${UPM_TAG}"
